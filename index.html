<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Labeler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header>
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Photo Labeler
      </div>
      <div class="header-actions">
        <button id="add-text-btn" class="btn btn-secondary" disabled>+ Add Text</button>
        <label for="file-input" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Upload Photo
        </label>
        <input type="file" id="file-input" accept="image/*" style="display:none">
      </div>
    </header>

    <main>

      <!-- ── Image workspace ── -->
      <div class="workspace" id="workspace">
        <div class="drop-zone" id="drop-zone">

          <div class="drop-hint" id="drop-hint">
            <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <p>Drag &amp; drop a photo here</p>
            <span>or click <strong>Upload Photo</strong></span>
          </div>

          <!-- Image + text overlays live inside this container -->
          <div id="image-container">
            <img id="photo" alt="" draggable="false">
            <!-- .text-overlay elements injected by JS -->
          </div>

        </div>
      </div>

      <!-- ── Sidebar ── -->
      <aside class="sidebar">

        <div id="state-empty" class="sidebar-state">
          <p>Upload a photo to start adding text labels.</p>
        </div>

        <div id="state-no-sel" class="sidebar-state" style="display:none">
          <p>Click <strong>+ Add Text</strong> to add a label to the photo.</p>
          <p class="hint">Click an existing label to select and edit it.</p>
        </div>

        <div id="state-edit" class="sidebar-state" style="display:none">

          <section>
            <h3>Text</h3>
            <textarea id="ctrl-text" rows="3" placeholder="Type your label…"></textarea>
          </section>

          <section>
            <h3>Font</h3>
            <select id="ctrl-font">
              <option value="Arial, sans-serif">Arial</option>
              <option value="'Georgia', serif">Georgia</option>
              <option value="'Times New Roman', serif">Times New Roman</option>
              <option value="'Courier New', monospace">Courier New</option>
              <option value="Impact, sans-serif">Impact</option>
              <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
              <option value="Verdana, sans-serif">Verdana</option>
              <option value="'Comic Sans MS', cursive"">Comic Sans MS</option>
            </select>
          </section>

          <section>
            <div class="label-row">
              <h3>Size</h3>
              <span><span id="size-display">32</span> px</span>
            </div>
            <input type="range" id="ctrl-size" min="8" max="200" value="32" step="1">
          </section>

          <section>
            <h3>Color</h3>
            <input type="color" id="ctrl-color" value="#ffffff">
          </section>

          <section>
            <div class="toggle-row">
              <label class="toggle"><input type="checkbox" id="ctrl-bold"> Bold</label>
              <label class="toggle"><input type="checkbox" id="ctrl-italic"> Italic</label>
              <label class="toggle"><input type="checkbox" id="ctrl-shadow" checked> Shadow</label>
            </div>
          </section>

          <section>
            <button id="delete-btn" class="btn btn-danger block">Delete Label</button>
          </section>

        </div>
      </aside>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>

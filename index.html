<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Labeler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Photo Labeler
      </div>
      <div class="header-actions">
        <button class="btn btn-outline" id="export-btn" disabled>Export JSON</button>
        <button class="btn btn-primary" id="upload-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Upload Photo
        </button>
        <input type="file" id="file-input" accept="image/*" hidden>
      </div>
    </header>

    <main>
      <div class="canvas-wrapper">
        <div id="drop-zone" class="drop-zone">
          <div class="drop-hint" id="drop-hint">
            <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <p>Drag &amp; drop a photo here</p>
            <span>or click <strong>Upload Photo</strong> above</span>
          </div>
          <canvas id="canvas"></canvas>
        </div>

        <div class="toolbar" id="toolbar">
          <div class="tool-group">
            <button class="tool-btn active" id="tool-draw" title="Draw a bounding box">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
              </svg>
              Draw Box
            </button>
            <button class="tool-btn" id="tool-select" title="Select an annotation">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 3l14 9-7 1-4 7z"/>
              </svg>
              Select
            </button>
          </div>
          <button class="btn btn-danger" id="delete-btn" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
            Delete
          </button>
        </div>
      </div>

      <aside class="sidebar">
        <section>
          <h3>Photo Description</h3>
          <textarea id="description" placeholder="Add a description for this photo..." rows="5"></textarea>
        </section>

        <section>
          <div class="section-header">
            <h3>Annotations</h3>
            <span class="badge" id="count">0</span>
          </div>
          <ul class="annotation-list" id="annotation-list">
            <li class="empty-hint">Draw boxes on the image to add annotations.</li>
          </ul>
        </section>
      </aside>
    </main>
  </div>

  <!-- Floating label input, lives at body level to avoid clipping -->
  <input type="text" id="label-input" class="label-input" placeholder="Enter label, press Enter…">

  <script src="app.js"></script>
</body>
</html>
